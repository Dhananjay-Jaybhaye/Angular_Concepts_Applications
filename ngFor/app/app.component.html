<h1 style="text-align: center;color: tomato;">Demonstration of ngFor Structural Directive</h1>

<h2>{{City}}</h2>

<h2>{{City[0]}}</h2>
<h2>{{City[1]}}</h2>
<h2>{{City[2]}}</h2>

<h2>Data Using For Loop</h2>
<div *ngFor = "let value of City; index as i">
  <h2>{{i}} : {{value}}</h2>
</div>
